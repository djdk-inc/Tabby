<!doctype html><title>Audible protection</title><button id="play">Play test tone</button><script>
document.querySelector('#play').onclick = () => { const ctx = new AudioContext(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); gain.gain.value = 0.03; osc.connect(gain).connect(ctx.destination); osc.start(); window.testAudio = { ctx, osc }; };
</script>
