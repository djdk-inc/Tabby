<!doctype html><html><head><meta charset="utf-8"><title>Tabby</title><link rel="stylesheet" href="ui.css"></head><body><main>
<div class="brand"><img class="mark" src="icons/tabby-48.png" alt=""><div><h1>Tabby</h1><div class="muted">Local-only tab library and sessions</div></div></div>
<nav class="tabs"><button class="active" data-tab="library">Saved tabs</button><button data-tab="sessions">Sessions</button><button data-tab="settings">Settings</button></nav>
<section id="library" class="panel active"><div class="row"><h2>Saved tabs</h2><button id="saveOpen">Save current window</button></div><div id="libraryList"></div></section>
<section id="sessions" class="panel"><div class="row"><h2>Sessions</h2><div class="button-row"><button id="exportSessionsJson">Export JSON</button><button id="exportSessionsCsv">Export CSV</button><button id="saveSession">Save current session</button></div></div><div id="sessionList"></div></section>
<section id="settings" class="panel"><div class="card"><label class="setting">Organize existing and new tabs automatically <input type="checkbox" data-setting="autoOrganize"></label><label class="setting">Group by <select data-setting="groupingMode"><option value="domain">Domain</option><option value="subdomain">Subdomain</option></select></label><label class="setting">Use compact site icons when recognized <input type="checkbox" data-setting="useSiteIcons"></label><label class="setting">Collapse a group when I leave it <input type="checkbox" data-setting="collapseOnLeave"></label><label class="setting">Collapse inactive groups <input type="checkbox" data-setting="collapseInactive"></label><label class="setting">Inactive after (minutes) <input type="number" min="1" max="10080" data-setting="inactiveMinutes"></label><label class="setting">Remove duplicates on navigation <input type="checkbox" data-setting="dedupeOnNavigate"></label><label class="setting">Protect pinned tabs <input type="checkbox" data-setting="protectPinned"></label><label class="setting">Protect audible tabs <input type="checkbox" data-setting="protectAudible"></label><label class="setting">Ignore tracking parameters when deduplicating <input type="checkbox" data-setting="stripTracking"></label><p class="status" id="settingsStatus"></p></div></section>
<script type="module" src="dashboard.js"></script></main></body></html>
